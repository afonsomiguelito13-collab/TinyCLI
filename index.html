<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TinyCLI Web</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* --- FONTES OFICIAIS (FALLBACK DO CHATGPT) --- */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        :root {
            --bg-color: #ebe9e1;
            --text-color: #1a1a1a;
            --input-bg: #f4f2ec;
            --border-color: #d1cec5;
            --accent: #a38877;
            --accent-hover: #8e7362;
            --font-stack: 'Söhne', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            --spring: cubic-bezier(0.175, 0.885, 0.32, 1.1);
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-stack); -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-color); color: var(--text-color); display: flex; height: 100vh; overflow: hidden; }
        
        /* --- SIDEBAR ANIMADA (Efeito Mola) --- */
        #sidebar-overlay {
            position: absolute; inset: 0; background: rgba(0,0,0,0.2); z-index: 90; opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        #sidebar-overlay.open { opacity: 1; pointer-events: auto; }
        
        #sidebar { 
            position: absolute; left: -280px; top: 0; bottom: 0; width: 280px; 
            background-color: var(--bg-color); border-right: 1px solid var(--border-color); 
            display: flex; flex-direction: column; padding: 20px 15px; z-index: 100;
            transition: transform 0.4s var(--spring); box-shadow: 4px 0 24px rgba(0,0,0,0.05);
        }
        #sidebar.open { transform: translateX(280px); }
        
        .sidebar-header { font-size: 1.4rem; font-weight: 700; display: flex; align-items: center; justify-content: space-between; padding: 0 10px 20px 10px; letter-spacing: -0.5px;}
        .sidebar-btn { display: flex; align-items: center; gap: 12px; padding: 12px 10px; border-radius: 8px; cursor: pointer; font-weight: 500; font-size: 0.9rem; margin-bottom: 5px; transition: background 0.2s;}
        .sidebar-btn:hover { background-color: #dfdbd1; }
        .badge { background-color: var(--accent); color: white; font-size: 0.7rem; padding: 3px 8px; border-radius: 12px; margin-left: auto; font-weight: 600;}
        .section-title { display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; font-weight: 600; padding: 20px 10px 10px 10px; color: #666; text-transform: uppercase; letter-spacing: 0.5px; }
        #chat-list { list-style: none; overflow-y: auto; flex: 1; }
        #chat-list li { padding: 10px; cursor: pointer; border-radius: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 0.9rem; color: #444; transition: background 0.2s;}
        #chat-list li:hover { background-color: #dfdbd1; }
        
        /* --- MAIN CHAT --- */
        #main { flex: 1; display: flex; flex-direction: column; position: relative; width: 100%; }
        #top-bar { padding: 15px 20px; display: flex; align-items: center; gap: 15px; font-size: 1rem; font-weight: 600; z-index: 10;}
        #menu-btn { cursor: pointer; transition: transform 0.2s; }
        #menu-btn:active { transform: scale(0.9); }
        #usage-display { margin-left: auto; font-size: 0.8rem; color: #555; background: #dfdbd1; padding: 4px 10px; border-radius: 12px; font-weight: 600;}
        
        #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; scroll-behavior: smooth;}
        
        /* --- ANIMAÇÃO DAS MENSAGENS --- */
        @keyframes popIn {
            0% { transform: translateY(20px) scale(0.95); opacity: 0; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }
        .message { max-width: 85%; padding: 14px 18px; border-radius: 18px; line-height: 1.5; font-size: 0.95rem; animation: popIn 0.3s var(--spring) forwards; transform-origin: bottom left;}
        .user { align-self: flex-end; background-color: #dfdbd1; color: #000; border-bottom-right-radius: 4px; transform-origin: bottom right;}
        .bot { align-self: flex-start; background-color: transparent; border: 1px solid var(--border-color); border-bottom-left-radius: 4px;}
        .bot pre { background: #1e1e1e; color: #d4d4d4; padding: 12px; border-radius: 8px; overflow-x: auto; font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; margin-top: 10px; font-size: 0.85rem;}
        
        /* --- INPUT AREA --- */
        footer { padding: 15px 20px 30px 20px; background: linear-gradient(transparent, var(--bg-color) 30%); }
        .input-wrapper { background-color: var(--input-bg); border: 1px solid var(--border-color); border-radius: 24px; padding: 12px 16px; display: flex; flex-direction: column; box-shadow: 0 8px 24px rgba(0,0,0,0.04); position: relative;}
        textarea { border: none; background: transparent; resize: none; outline: none; font-size: 1rem; max-height: 120px; padding: 0; color: var(--text-color); width: 100%; line-height: 1.4; font-family: var(--font-stack);}
        textarea::placeholder { color: #999; }
        .input-controls { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
        
        /* --- SELETOR DE MODELO CUSTOMIZADO --- */
        .model-select-container { position: relative; }
        .model-trigger { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; color: #555; font-weight: 600; cursor: pointer; padding: 6px 10px; border-radius: 12px; background: #dfdbd1; transition: background 0.2s; user-select: none;}
        .model-trigger:hover { background: #d1cec5; }
        .model-trigger i { width: 14px; height: 14px; transition: transform 0.3s var(--spring); }
        .model-trigger.open i { transform: rotate(180deg); }
        
        .model-dropdown {
            position: absolute; bottom: calc(100% + 10px); left: 0; background: var(--input-bg);
            border: 1px solid var(--border-color); border-radius: 12px; width: 220px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); overflow: hidden; z-index: 50;
            transform: translateY(10px) scale(0.95); opacity: 0; pointer-events: none;
            transition: all 0.3s var(--spring); transform-origin: bottom left;
        }
        .model-dropdown.open { transform: translateY(0) scale(1); opacity: 1; pointer-events: auto; }
        .model-option { padding: 12px 16px; font-size: 0.9rem; cursor: pointer; transition: background 0.2s; display: flex; align-items: center; justify-content: space-between;}
        .model-option:hover { background: #dfdbd1; }
        .model-option.active { font-weight: 700; color: var(--accent); }
        
        .actions { display: flex; gap: 10px; align-items: center; }
        .send-btn { background-color: var(--accent); color: white; border: none; width: 36px; height: 36px; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; transform: scale(0.9); opacity: 0.5; transition: all 0.2s var(--spring);}
        .send-btn.active { opacity: 1; transform: scale(1); }
        .send-btn:active { transform: scale(0.85); }

        /* Center Logo */
        #center-logo { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; color: #b5b0a1; pointer-events: none; transition: opacity 0.3s;}
        #center-logo i { width: 48px; height: 48px; margin-bottom: 10px;}
        .project-pill { background-color: #dfdbd1; padding: 6px 14px; border-radius: 16px; font-size: 0.85rem; display: flex; align-items: center; gap: 6px; color: #555; margin-top: 10px; font-weight: 600;}
    </style>
</head>
<body>

    <div id="sidebar-overlay" onclick="toggleSidebar()"></div>

    <div id="sidebar">
        <div class="sidebar-header">
            <span><i data-lucide="terminal"></i> TinyCLI</span>
            <i data-lucide="search" style="width:20px; cursor:pointer;"></i>
        </div>
        <div class="sidebar-btn" onclick="newChat()">
            <i data-lucide="square-pen" style="width:18px;"></i> New chat
        </div>
        <div class="sidebar-btn">
            <i data-lucide="layout-dashboard" style="width:18px;"></i> Sessions <span class="badge">Termux</span>
        </div>
        
        <div class="section-title">
            <span>Chats Anteriores</span>
            <i data-lucide="chevron-down" style="width:16px;"></i>
        </div>
        <ul id="chat-list">
            <!-- Sessões carregadas aqui via JS -->
        </ul>
    </div>

    <div id="main">
        <div id="top-bar">
            <i data-lucide="menu" id="menu-btn" onclick="toggleSidebar()"></i>
            <span id="chat-title">New chat</span>
            <span id="usage-display">0 / 50k</span>
        </div>
        
        <div id="center-logo">
            <i data-lucide="terminal"></i>
            <div class="project-pill"><i data-lucide="folder" style="width:14px;"></i> Localhost <i data-lucide="chevron-down" style="width:14px;"></i></div>
        </div>

        <div id="chat-container"></div>

        <footer>
            <div class="input-wrapper">
                <textarea id="user-input" rows="1" placeholder="Ask TinyCLI..."></textarea>
                <div class="input-controls">
                    
                    <!-- SELETOR DE MODELO CUSTOMIZADO -->
                    <div class="model-select-container">
                        <div class="model-trigger" id="model-trigger" onclick="toggleModelDropdown(event)">
                            <span id="current-model-text">DeepSeek V4.1 Flash</span>
                            <i data-lucide="chevron-up"></i>
                        </div>
                        <div class="model-dropdown" id="model-dropdown">
                            <div class="model-option active" data-value="deepseek-v4.1-flash" onclick="selectModel(this)">DeepSeek V4.1 Flash</div>
                            <div class="model-option" data-value="gemini-3.8-flash" onclick="selectModel(this)">Gemini 3.8 Flash</div>
                            <div class="model-option" data-value="agnes-3.0-flash" onclick="selectModel(this)">Agnes 3.0 Flash</div>
                            <div class="model-option" data-value="deepseek-v4-flash" onclick="selectModel(this)">DeepSeek V4 Flash</div>
                        </div>
                    </div>

                    <div class="actions">
                        <button class="send-btn" id="send-btn" onclick="sendMessage()"><i data-lucide="arrow-up"></i></button>
                    </div>
                </div>
            </div>
        </footer>
    </div>

    <script>
        lucide.createIcons();
        
        // Aponta para o servidor local do Termux
        const API_URL = "http://127.0.0.1:8080"; 
        let currentSessionId = "nova_" + Date.now();
        let selectedModel = "deepseek-v4.1-flash";

        // --- UI ANIMATIONS ---
        const textarea = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const centerLogo = document.getElementById('center-logo');
        const chatContainer = document.getElementById('chat-container');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebar-overlay');

        function toggleSidebar() {
            sidebar.classList.toggle('open');
            overlay.classList.toggle('open');
        }

        function toggleModelDropdown(e) {
            e.stopPropagation();
            document.getElementById('model-trigger').classList.toggle('open');
            document.getElementById('model-dropdown').classList.toggle('open');
        }

        function selectModel(element) {
            document.querySelectorAll('.model-option').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            selectedModel = element.getAttribute('data-value');
            document.getElementById('current-model-text').textContent = element.textContent;
            document.getElementById('model-trigger').classList.remove('open');
            document.getElementById('model-dropdown').classList.remove('open');
        }

        document.addEventListener('click', () => {
            document.getElementById('model-trigger').classList.remove('open');
            document.getElementById('model-dropdown').classList.remove('open');
        });

        textarea.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
            if(this.value.trim().length > 0) {
                sendBtn.classList.add('active');
                centerLogo.style.opacity = '0';
            } else {
                sendBtn.classList.remove('active');
                if(chatContainer.children.length === 0) centerLogo.style.opacity = '1';
            }
        });

        // --- FETCH DATA (USAGE + SESSIONS) ---
        async function loadData() {
            try {
                const resSessions = await fetch(`${API_URL}/sessions`);
                const dataSessions = await resSessions.json();
                const list = document.getElementById('chat-list');
                list.innerHTML = "";
                dataSessions.sessions.forEach(s => {
                    const li = document.createElement('li');
                    li.textContent = s;
                    li.onclick = () => loadHistory(s);
                    list.appendChild(li);
                });

                // Pede o usage real do ficheiro .json no Termux
                const resUsage = await fetch(`${API_URL}/usage`);
                const dataUsage = await resUsage.json();
                document.getElementById('usage-display').textContent = `${dataUsage.tokens} / 50k`;

            } catch(e) { console.log("Servidor Termux offline."); }
        }

        async function loadHistory(sessionId) {
            currentSessionId = sessionId;
            document.getElementById('chat-title').textContent = sessionId;
            chatContainer.innerHTML = "";
            centerLogo.style.opacity = '0';
            toggleSidebar();
            
            const res = await fetch(`${API_URL}/history/${sessionId}`);
            const data = await res.json();
            
            data.messages.forEach(msg => {
                if (msg.role === "user" || msg.role === "assistant") {
                    addMessage(msg.content, msg.role === "user" ? "user" : "bot");
                }
            });
        }

        function newChat() {
            currentSessionId = "nova_" + Date.now();
            chatContainer.innerHTML = "";
            document.getElementById('chat-title').textContent = "New chat";
            centerLogo.style.opacity = '1';
            toggleSidebar();
        }

        // --- SEND MESSAGE ---
        async function sendMessage() {
            const text = textarea.value.trim();
            if (!text) return;

            addMessage(text, 'user');
            textarea.value = '';
            textarea.style.height = 'auto';
            sendBtn.classList.remove('active');
            centerLogo.style.opacity = '0';

            const loadingId = addMessage("⏳ Pensando...", 'bot');

            try {
                const response = await fetch(`${API_URL}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: text, model: selectedModel, session_id: currentSessionId })
                });
                const data = await response.json();
                updateMessage(loadingId, data.reply);
                loadData();
            } catch (error) {
                updateMessage(loadingId, "❌ ERRO: O servidor no Termux não está a correr. Usa `python tiny_web_server.py`.");
            }
        }

        function addMessage(text, sender) {
            const div = document.createElement('div');
            div.className = `message ${sender}`;
            div.innerHTML = text.replace(/\n/g, '<br>');
            div.id = 'msg-' + Date.now() + Math.random();
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return div.id;
        }

        function updateMessage(id, newText) {
            const div = document.getElementById(id);
            let formatted = newText.replace(/```(.*?)```/gs, '<pre><code>$1</code></pre>');
            formatted = formatted.replace(/\n/g, '<br>');
            div.innerHTML = formatted;
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        loadData();
        setInterval(loadData, 10000);
    </script>
</body>
</html>
