<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tiny CLI</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/iconoir@7.7.0/css/iconoir.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

        :root {
            --bg-main: #121212; --bg-surface: #1e1e1e; --bg-hover: #2a2a2a;
            --text-primary: #f3f3f3; --text-secondary: #a1a1aa; --border-color: #333333;
            --accent: #ffffff;
            --font-stack: 'Inter', sans-serif;
            --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
            --sidebar-width: 280px;
        }
        
        body.light-theme {
            --bg-main: #f9f9f9; --bg-surface: #ffffff; --bg-hover: #f0f0f0;
            --text-primary: #1a1a1a; --text-secondary: #6b6b6b; --border-color: #e5e5e5;
            --accent: #2d2d2d;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-stack); -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-main); color: var(--text-primary); display: flex; height: 100vh; overflow: hidden; transition: background 0.3s, color 0.3s; }
        
        /* SIDEBAR */
        #sidebar-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.4); z-index: 150; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
        #sidebar-overlay.open { opacity: 1; pointer-events: auto; }
        #sidebar { position: absolute; left: calc(var(--sidebar-width) * -1); top: 0; bottom: 0; width: var(--sidebar-width); background: var(--bg-surface); border-right: 1px solid var(--border-color); z-index: 200; display: flex; flex-direction: column; transition: transform 0.3s var(--ease-out), background 0.3s; }
        #sidebar.open { transform: translateX(var(--sidebar-width)); }
        .sidebar-header { padding: 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); }
        .sidebar-header h2 { font-size: 1.1rem; font-weight: 600; }
        .sidebar-header i { cursor: pointer; color: var(--text-secondary); font-size: 20px; }
        .sidebar-content { flex: 1; overflow-y: auto; padding: 12px; }
        .new-chat-btn { width: 100%; display: flex; align-items: center; gap: 10px; padding: 10px; border: 1px solid var(--border-color); border-radius: 8px; background: transparent; color: var(--text-primary); font-weight: 500; font-size: 0.9rem; cursor: pointer; transition: background 0.2s; margin-bottom: 16px; }
        .new-chat-btn:hover { background: var(--bg-hover); }
        .section-title { font-size: 0.75rem; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; padding: 8px; margin-bottom: 4px; }
        #chat-list { list-style: none; }
        #chat-list li { padding: 10px; border-radius: 6px; cursor: pointer; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: background 0.2s; display: flex; align-items: center; gap: 8px; color: var(--text-primary);}
        #chat-list li:hover { background: var(--bg-hover); }
        .sidebar-footer { padding: 16px; border-top: 1px solid var(--border-color); }
        .usage-label { font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 8px; display: flex; justify-content: space-between; }
        .usage-bar-bg { width: 100%; height: 6px; background: var(--bg-hover); border-radius: 3px; overflow: hidden; }
        .usage-bar-fill { height: 100%; background: var(--text-primary); width: 0%; transition: width 0.3s; }

        /* TOP BAR */
        #top-bar { position: absolute; top: 0; left: 0; right: 0; height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; z-index: 100; background: var(--bg-main); border-bottom: 1px solid var(--border-color); transition: background 0.3s, border 0.3s; }
        .icon-btn { display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 8px; cursor: pointer; transition: background 0.2s; color: var(--text-secondary); }
        .icon-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
        .icon-btn i { font-size: 20px; }
        .model-selector-container { position: relative; display: flex; justify-content: center; }
        .model-btn { display: flex; align-items: center; gap: 6px; font-size: 0.95rem; font-weight: 500; color: var(--text-primary); cursor: pointer; padding: 6px 12px; border-radius: 8px; background: transparent; border: 1px solid transparent; transition: all 0.2s; }
        .model-btn:hover { background: var(--bg-hover); border-color: var(--border-color); }
        .model-btn i { font-size: 16px; color: var(--text-secondary); }
        #model-dropdown { position: absolute; top: 45px; left: 50%; width: 260px; background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: 12px; padding: 6px; box-shadow: 0 8px 24px rgba(0,0,0,0.2); transform: translateX(-50%) translateY(-5px) scale(0.98); opacity: 0; visibility: hidden; transition: all 0.2s var(--ease-out); z-index: 200; }
        #model-dropdown.show { transform: translateX(-50%) translateY(0) scale(1); opacity: 1; visibility: visible; }
        .dropdown-item { padding: 10px 12px; cursor: pointer; display: flex; align-items: center; gap: 10px; border-radius: 8px; transition: background 0.1s; }
        .dropdown-item:hover { background: var(--bg-hover); }
        .dropdown-item i { font-size: 18px; color: var(--text-secondary); }
        .dropdown-item.active i { color: var(--text-primary); }
        .item-content { display: flex; flex-direction: column; }
        .item-title { font-size: 0.9rem; color: var(--text-primary); font-weight: 500; }
        .item-desc { font-size: 0.8rem; color: var(--text-secondary); margin-top: 2px; }

        /* MAIN CHAT */
        #main { flex: 1; display: flex; flex-direction: column; position: relative; width: 100%; height: 100%; }
        #chat-container { flex: 1; overflow-y: auto; padding: 80px 20px 120px 20px; display: flex; flex-direction: column; gap: 24px; }
        #welcome-screen { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; text-align: center; width: 100%; max-width: 600px; padding: 0 20px; transition: opacity 0.3s var(--ease-out); }
        #welcome-screen.hide { opacity: 0; pointer-events: none; }
        #welcome-screen h1 { font-size: 2rem; font-weight: 500; margin-bottom: 24px; color: var(--text-primary); letter-spacing: -0.5px;}
        .welcome-suggestions { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px;}
        .welcome-btn { background: var(--bg-surface); border: 1px solid var(--border-color); padding: 8px 16px; border-radius: 20px; font-size: 0.9rem; cursor: pointer; color: var(--text-secondary); transition: all 0.2s; }
        .welcome-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
        @keyframes fadeIn { 0% { opacity: 0; transform: translateY(4px); } 100% { opacity: 1; transform: translateY(0); } }
        .message { max-width: 85%; line-height: 1.6; font-size: 0.95rem; animation: fadeIn 0.2s var(--ease-out) forwards; }
        .user { align-self: flex-end; background-color: var(--bg-surface); color: var(--text-primary); padding: 12px 16px; border-radius: 16px; border-bottom-right-radius: 4px; border: 1px solid var(--border-color); }
        .bot { align-self: flex-start; background-color: transparent; color: var(--text-primary); padding: 8px 0; padding-left: 4px; }
        .bot p { margin-bottom: 12px; }
        .bot p:last-child { margin-bottom: 0; }
        .bot pre { background: var(--bg-surface); border: 1px solid var(--border-color); padding: 16px; border-radius: 12px; overflow-x: auto; margin-top: 12px; font-size: 0.85rem; }
        .bot code { background: var(--bg-hover); padding: 2px 6px; border-radius: 4px; font-family: monospace; font-size: 0.9em; }

        footer { position: absolute; bottom: 0; left: 0; right: 0; padding: 0 16px 24px 16px; background: linear-gradient(transparent, var(--bg-main) 30%); z-index: 50; display: flex; justify-content: center; transition: background 0.3s;}
        .input-container { width: 100%; max-width: 768px; display: flex; flex-direction: column; align-items: center; }
        .input-wrapper { width: 100%; background-color: var(--bg-surface); border: 1px solid var(--border-color); border-radius: 24px; padding: 12px 16px; display: flex; align-items: flex-end; gap: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.05); transition: border-color 0.2s, background 0.3s;}
        .input-wrapper:focus-within { border-color: var(--text-secondary); }
        .input-icon { color: var(--text-secondary); font-size: 20px; padding-bottom: 4px;}
        textarea { flex: 1; border: none; background: transparent; resize: none; outline: none; font-size: 1rem; max-height: 200px; padding: 4px 0; color: var(--text-primary); line-height: 1.5; font-family: var(--font-stack);}
        textarea::placeholder { color: var(--text-secondary); }
        .send-btn { background-color: var(--text-primary); color: var(--bg-main); border: none; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s var(--ease-out); opacity: 0.2; flex-shrink: 0;}
        .send-btn.active { opacity: 1; }
        .send-btn i { font-size: 16px; }
        .footer-text { font-size: 0.75rem; color: var(--text-secondary); margin-top: 12px; text-align: center; }
    </style>
</head>
<body>

    <div id="sidebar-overlay" onclick="toggleSidebar()"></div>
    <div id="sidebar">
        <div class="sidebar-header">
            <h2>Tiny CLI</h2>
            <i class="iconoir-x" onclick="toggleSidebar()"></i>
        </div>
        <div class="sidebar-content">
            <button class="new-chat-btn" onclick="newChat()">
                <i class="iconoir-plus"></i> Nova Conversa
            </button>
            <div class="section-title">Histórico</div>
            <ul id="chat-list"></ul>
        </div>
        <div class="sidebar-footer">
            <div class="usage-label"><span>Usage Semanal</span> <span id="usage-percent">0%</span></div>
            <div class="usage-bar-bg">
                <div class="usage-bar-fill" id="usage-bar"></div>
            </div>
        </div>
    </div>

    <div id="top-bar">
        <div class="icon-btn" onclick="toggleSidebar()">
            <i class="iconoir-menu"></i>
        </div>
        
        <div class="model-selector-container">
            <button class="model-btn" id="model-btn" onclick="toggleDropdown(event)">
                <span id="current-model-text">DeepSeek</span>
                <i class="iconoir-nav-arrow-down"></i>
            </button>
            <div id="model-dropdown">
                <div class="dropdown-item active" onclick="selectModel(this)">
                    <i class="iconoir-cpu"></i>
                    <div class="item-content"><div class="item-title">DeepSeek</div><div class="item-desc">V4.1</div></div>
                </div>
                <div class="dropdown-item" onclick="selectModel(this)">
                    <i class="iconoir-flash"></i>
                    <div class="item-content"><div class="item-title">Agnes</div><div class="item-desc">3.0 Flash</div></div>
                </div>
                <div class="dropdown-item" onclick="selectModel(this)">
                    <i class="iconoir-brain"></i>
                    <div class="item-content"><div class="item-title">GPT</div><div class="item-desc">6 Luna</div></div>
                </div>
                <div class="dropdown-item" onclick="selectModel(this)">
                    <i class="iconoir-rocket"></i>
                    <div class="item-content"><div class="item-title">Space</div><div class="item-desc">Bunny</div></div>
                </div>
            </div>
        </div>

        <div class="icon-btn" onclick="toggleTheme()">
            <i class="iconoir-half-moon" id="theme-icon"></i>
        </div>
    </div>

    <div id="main" style="touch-action: pan-y;">
        <div id="welcome-screen">
            <h1>Como posso ajudar hoje?</h1>
            <div class="welcome-suggestions">
                <div class="welcome-btn" onclick="sendSuggestion('Criar um script Python')">Criar um script Python</div>
                <div class="welcome-btn" onclick="sendSuggestion('Explicar um código')">Explicar um código</div>
                <div class="welcome-btn" onclick="sendSuggestion('Ajuda com Termux')">Ajuda com Termux</div>
            </div>
        </div>

        <div id="chat-container"></div>

        <footer>
            <div class="input-container">
                <div class="input-wrapper">
                    <i class="iconoir-attachment input-icon"></i>
                    <textarea id="user-input" rows="1" placeholder="Pergunte alguma coisa..."></textarea>
                    <button class="send-btn" id="send-btn" onclick="sendMessage()"><i class="iconoir-arrow-up"></i></button>
                </div>
                <div class="footer-text">O Tiny CLI pode cometer erros. Verifique informações importantes.</div>
            </div>
        </footer>
    </div>

    <script>
        marked.setOptions({ gfm: true, breaks: true });
        
        const API_URL = window.location.origin; 
        let currentSessionId = "nova_" + Date.now();
        let selectedModel = "deepseek-v4.1";

        const textarea = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const welcomeScreen = document.getElementById('welcome-screen');
        const chatContainer = document.getElementById('chat-container');
        const dropdown = document.getElementById('model-dropdown');
        const modelBtn = document.getElementById('model-btn');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebar-overlay');

        // TEMA
        function toggleTheme() {
            document.body.classList.toggle('light-theme');
            const isLight = document.body.classList.contains('light-theme');
            localStorage.setItem('tiny-theme', isLight ? 'light' : 'dark');
            document.getElementById('theme-icon').className = isLight ? 'iconoir-sun-light' : 'iconoir-half-moon';
        }

        if (localStorage.getItem('tiny-theme') === 'light') {
            document.body.classList.add('light-theme');
            document.getElementById('theme-icon').className = 'iconoir-sun-light';
        }

        // SIDEBAR
        function toggleSidebar() {
            sidebar.classList.toggle('open');
            overlay.classList.toggle('open');
        }

        function newChat() {
            currentSessionId = "nova_" + Date.now();
            chatContainer.innerHTML = "";
            welcomeScreen.classList.remove('hide');
            toggleSidebar();
        }

        async function loadSessions() {
            try {
                const res = await fetch(`${API_URL}/sessions`);
                const data = await res.json();
                const list = document.getElementById('chat-list');
                list.innerHTML = "";
                data.sessions.forEach(s => {
                    const li = document.createElement('li');
                    li.innerHTML = `<i class="iconoir-message-text"></i> ${s.length > 18 ? s.substring(0,18)+"..." : s}`;
                    li.onclick = () => loadHistory(s);
                    list.appendChild(li);
                });
            } catch(e) { console.log("Erro ao carregar sessões:", e); }
        }

        async function loadHistory(sessionId) {
            currentSessionId = sessionId;
            chatContainer.innerHTML = "";
            welcomeScreen.classList.add('hide');
            toggleSidebar();
            
            try {
                const res = await fetch(`${API_URL}/history/${sessionId}`);
                const data = await res.json();
                data.messages.forEach(msg => {
                    if (msg.role === "user" || msg.role === "assistant") {
                        addMessage(msg.content, msg.role === "user" ? "user" : "bot");
                    }
                });
            } catch(e) { console.log("Erro ao carregar histórico:", e); }
        }

        async function loadUsage() {
            try {
                const res = await fetch(`${API_URL}/usage`);
                const data = await res.json();
                const tokens = data.tokens || 0;
                const limit = 5000000;
                const percent = Math.min(100, Math.round((tokens / limit) * 100));
                
                document.getElementById('usage-percent').textContent = `${percent}%`;
                document.getElementById('usage-bar').style.width = `${percent}%`;
            } catch(e) {}
        }

        // DROPDOWN
        function toggleDropdown(e) {
            e.stopPropagation();
            dropdown.classList.toggle('show');
        }

        document.addEventListener('click', (e) => {
            if (!modelBtn.contains(e.target) && !dropdown.contains(e.target)) {
                dropdown.classList.remove('show');
            }
        });

        function selectModel(element) {
            document.querySelectorAll('.dropdown-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            
            const titleText = element.querySelector('.item-title').textContent;
            document.getElementById('current-model-text').textContent = titleText;
            
            if (titleText === 'DeepSeek') selectedModel = 'deepseek-v4.1';
            else if (titleText === 'Agnes') selectedModel = 'agnes-3.0-flash';
            else if (titleText === 'GPT') selectedModel = 'gpt-6-luna';
            else if (titleText === 'Space') selectedModel = 'space-bunny';
            
            dropdown.classList.remove('show');
        }

        // CHAT
        textarea.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
            if(this.value.trim().length > 0) {
                sendBtn.classList.add('active');
                if(chatContainer.children.length === 0) welcomeScreen.classList.add('hide');
            } else {
                sendBtn.classList.remove('active');
                if(chatContainer.children.length === 0) welcomeScreen.classList.remove('hide');
            }
        });

        textarea.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                if(this.value.trim().length > 0) sendMessage();
            }
        });

        function sendSuggestion(text) {
            textarea.value = text;
            sendMessage();
        }

        async function sendMessage() {
            const text = textarea.value.trim();
            if (!text) return;

            addMessage(text, 'user');
            textarea.value = '';
            textarea.style.height = 'auto';
            sendBtn.classList.remove('active');
            welcomeScreen.classList.add('hide');

            const loadingId = addMessage("...", 'bot');

            try {
                const response = await fetch(`${API_URL}/api/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        messages: [{ role: 'user', content: text }], 
                        model: selectedModel, 
                        session_id: currentSessionId 
                    })
                });
                const data = await response.json();
                
                if (data.choices && data.choices[0]) {
                    updateMessage(loadingId, data.choices[0].message.content, null);
                } else {
                    updateMessage(loadingId, "Erro: Resposta inválida do servidor.", null);
                }
                
                loadUsage();
                loadSessions();
            } catch (error) {
                updateMessage(loadingId, "Erro: O servidor no Render não está a responder.", null);
            }
        }

        function addMessage(text, sender) {
            const div = document.createElement('div');
            div.className = `message ${sender}`;
            if (sender === 'user') {
                div.innerHTML = text.replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\n/g, '<br>');
            } else {
                div.innerHTML = marked.parse(text);
            }
            div.id = 'msg-' + Date.now() + Math.random();
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return div.id;
        }

        function updateMessage(id, newText, execCommand) {
            const div = document.getElementById(id);
            let html = marked.parse(newText);
            
            if (execCommand) {
                html += `
                <div style="background:var(--bg-surface); border:1px solid var(--border-color); padding:12px; border-radius:8px; margin-top:12px;">
                    <div style="font-size:0.8rem; color:var(--text-secondary); margin-bottom:8px;">O Agente quer executar:</div>
                    <div style="background:var(--bg-hover); padding:10px; border-radius:6px; font-family:monospace; font-size:0.85rem; overflow-x:auto;">${execCommand.replace(/</g, "&lt;").replace(/>/g, "&gt;")}</div>
                    <button style="background:var(--accent); color:var(--bg-main); border:none; padding:8px 16px; border-radius:6px; font-weight:500; cursor:pointer; margin-top:10px; font-size:0.9rem;" onclick="executarComandoReal('${execCommand.replace(/'/g, "\\'")}')">Executar</button>
                </div>`;
            }
            div.innerHTML = html;
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function executarComandoReal(cmd) {
            const execId = addMessage("A executar...", 'bot');
            try {
                const response = await fetch(`${API_URL}/execute`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ command: cmd })
                });
                const data = await response.json();
                updateMessage(execId, `Comando executado:\n\`\`\`bash\n${data.output}\n\`\`\``, null);
            } catch (error) {
                updateMessage(execId, "Erro ao executar.", null);
            }
        }

        // Init
        loadSessions();
        loadUsage();
    </script>
</body>
</html>
